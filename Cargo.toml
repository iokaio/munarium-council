# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-council"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Request-bound approval, distinct ratification, and recorded governance activation."
repository = "https://github.com/iokaio/munarium-council"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
jsonschema = { version = "=0.26.2", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"

[dev-dependencies]
tempfile = "=3.27.0"
